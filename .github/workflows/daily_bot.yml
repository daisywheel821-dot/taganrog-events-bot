name: Run Taganrog Events Bot

on:
  schedule:
    # Запуск каждый день в 08:00 по МСК (05:00 UTC)
    - cron: '0 5 * * *'
  # Возможность запуска вручную по кнопке в интерфейсе GitHub
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Чтение репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Запуск бота
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python taganrog_events_bot.py

      - name: Сохранение обновленной базы SQLite в репозиторий
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/taganrog_events.db
          git commit -m "auto: update sent events database [skip ci]" || exit 0
          git push
